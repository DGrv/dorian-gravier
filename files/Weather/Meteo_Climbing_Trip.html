    <script src="https://code.jquery.com/jquery-latest.min.js"></script>

    <style>
      div.container {
        max-width: 900px;
        width: 100%;
        margin: 0 auto;
      }

      details.spot {
        margin-bottom: 1rem;
      }

      details.spot > summary {
        cursor: pointer;
        list-style: none; /* hide default marker (Firefox) */
      }
      details.spot > summary::-webkit-details-marker {
        display: none; /* hide default marker (Chrome/Safari) */
      }

      details.spot > summary h1 {
        display: inline-block;
        margin: 0.5rem 0;
      }
      details.spot > summary h1::before {
        content: "▸ ";
        display: inline-block;
        transition: transform 0.2s;
      }
      details.spot[open] > summary h1::before {
        content: "▾ ";
      }

      details.spot iframe {
        width: 100%;
        height: 700px;
        border: 0;
        overflow: hidden;
      }
    </style>
  </head>

    <script>
      // Load each iframe only the first time its section is opened
      document.querySelectorAll("details.spot").forEach(function (details) {
        details.addEventListener("toggle", function () {
          if (!details.open) return;
          var iframe = details.querySelector("iframe[data-src]");
          if (iframe && !iframe.getAttribute("src")) {
            iframe.setAttribute("src", iframe.dataset.src);
          }
        });
      });
    </script>
