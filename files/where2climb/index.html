<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>where2climb</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="map-container">
      <div id="search-box">
        <input id="search-input" type="text" placeholder="Search city...">
        <div id="search-results"></div>
      </div>
      <div id="map"></div>

      <button id="mobile-sidebar-toggle" title="Show saved places">&#9776; Places</button>
    </div>

    <div id="sidebar-resize-handle"></div>

    <aside id="sidebar">
      <div id="app-brand">
        where2climb <span id="app-version">v1.0.0</span>
      </div>
      <div id="sidebar-top">
        <h2>Saved places</h2>
        <div id="sidebar-controls">
          <label id="autoopen-label">
            <input type="checkbox" id="autoopen-checkbox">
            Auto-open popups
          </label>
          <button id="delete-all-btn" title="Delete all saved places">Delete all</button>
          <button id="fullscreen-toggle" title="Toggle full-screen sidebar">&#x26F6;</button>
        </div>
      </div>
      <div id="sidebar-list"></div>
    </aside>
  </div>

  <div id="lightbox" class="hidden">
    <div id="lightbox-content">
      <div id="lightbox-title"></div>
      <img id="lightbox-img" alt="Meteogram, enlarged">
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
